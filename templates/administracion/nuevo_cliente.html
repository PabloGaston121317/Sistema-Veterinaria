{% extends 'base.html' %}

{% block contenido-1 %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Nuevo Cliente</h3>
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.dni.label }}
                    </label>
                    {{ form.dni }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.nombre.label }}
                    </label>
                    {{ form.nombre }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.apellido.label }}
                    </label>
                    {{ form.apellido }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.direccion.label }}
                    </label>
                    {{ form.direccion }}
                </div>

                <button class="btn btn-success">
                    Guardar Cliente
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
