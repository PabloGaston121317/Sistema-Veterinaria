{% extends 'base.html' %}
{% block contenido-1 %}
<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Nuevo Animal</h3>
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.nombre.label }}
                    </label>
                    {{ form.nombre }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.raza.label }}
                    </label>
                    {{ form.raza }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.categoria.label }}
                    </label>
                    {{ form.categoria }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.duenio.label }}
                    </label>
                    {{ form.duenio }}
                </div>

                <button class="btn btn-success">
                    Guardar Paciente
                </button>

            </form>

        </div>

    </div>

</div>



{% endblock %}
