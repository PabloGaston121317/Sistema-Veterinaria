<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Cliente</title>
</head>
<body>
    <h3>Datos Del Cliente</h3>
    <table style="width: 80%;margin: 30px auto;border-collapse: collapse;border: 2px solid #4CAF50;font-family: Arial, sans-serif;text-align: center;box-shadow: 0px 4px 10px rgba(0,0,0,0.2);background-color: #ffffff;">
        <thead>
            <tr>
                <th>DNI</th>
                <th>NOMBRE</th>
                <th>APELLIDO</th>
                <th>DIRECCION</th>
            </tr>
        </thead>
        <tr>
            <td>{{ cliente.dni }}</td>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.apellido }}</td>
            <td>{{ cliente.direccion }}</td>
        </tr>
    </table>
    
</body>
</html>
